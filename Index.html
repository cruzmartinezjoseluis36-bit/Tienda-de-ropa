                                                                                                                                                                                                                                                                            ><!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Force | Tienda Deportiva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="main-header">
        <nav class="navbar">
            <div class="logo">TWO FORCE</div>
            <ul class="nav-links">
                <li><a href="#" onclick="showHome()">INICIO</a></li>
                <li><a href="#" onclick="filterByGender('Hombre')">HOMBRE</a></li>
                <li><a href="#" onclick="filterByGender('Mujer')">MUJER</a></li>
            </ul>
        </nav>
    </header>

    <main id="app-container">
        <section id="home-view" class="view">
            <h1 class="main-title">TWO FORCE</h1>
            <div class="gender-selection">
                <div class="card male" onclick="filterByGender('Hombre')">
                    <img src="https://via.placeholder.com/300x400?text=Hombre+Fitness" alt="Hombres">
                    <button class="btn-blue">HOMBRES</button>
                    <span>HOMBRE</span>
                </div>
                <div class="card female" onclick="filterByGender('Mujer')">
                    <img src="https://via.placeholder.com/300x400?text=Mujer+Fitness" alt="Mujeres">
                    <button class="btn-pink">MUJERES</button>
                    <span>MUJER</span>
                </div>
            </div>
        </section>

        <section id="catalog-view" class="view hidden">
            <h2 id="catalog-title"></h2>
            <div id="sections-wrapper">
                </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
